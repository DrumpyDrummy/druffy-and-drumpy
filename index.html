<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Druffy & Drumpy</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Dancing+Script:wght@500&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0B0B14;
            color: #F4EBDD;
            font-family: 'Playfair Display', serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 30px;
        }

        h1 {
            font-size: 4rem;
            line-height: 1.2;
            font-weight: 600;
            margin-bottom: 35px;
        }

        .subtitle {
            font-family: 'Dancing Script', cursive;
            font-size: 2rem;
            margin-bottom: 45px;
        }

        .button {
            display: inline-block;
            padding: 16px 36px;
            border: 1px solid #F4EBDD;
            color: #F4EBDD;
            text-decoration: none;
            border-radius: 999px;
            transition: .3s;
        }

        .button:hover {
            background: #F4EBDD;
            color: #0B0B14;
        }

    </style>
</head>

<body>

<div class="container">

    <h1>
        three years down,<br>
        forever to go.
    </h1>

    <div class="subtitle">
        happy anniversary baby ♡
    </div>

    <a class="button" href="#">
        ♡ enter ♡
    </a>

</div>

</body>
</html>
